services:

  # ---------------------------------------------------------------
  # Challenge 1: LFI / RFI  (OWASP A03:2021 - Injection)  port 5050
  # ---------------------------------------------------------------
  challenge-lfi:
    build: ./challenge-lfi
    container_name: ctf-lfi
    ports:
      - "5050:5000"
    volumes:
      - ./logs/lfi:/data          # separate SQLite action-log DB lives here
    environment:
      - LOG_DB=/data/userlog.db
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Challenge 2: PATH TRAVERSAL (OWASP A01:2021 - Broken Access
  # Control)  port 5051
  # ---------------------------------------------------------------
  challenge-traversal:
    build: ./challenge-traversal
    container_name: ctf-traversal
    ports:
      - "5051:5000"
    volumes:
      - ./logs/traversal:/data    # separate SQLite action-log DB lives here
    environment:
      - LOG_DB=/data/userlog.db
    restart: unless-stopped
